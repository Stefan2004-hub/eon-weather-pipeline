[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eon-weather-pipeline"
version = "0.1.0"
description = "Local weather intelligence pipeline for energy planning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "pydantic-settings>=2.6.1",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
]

[project.scripts]
weather-pipeline = "weather_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
